        *{font-family: Inter, system-ui, sans-serif}
        .checker{background-image: conic-gradient(#e5e7eb 25%, transparent 0 50%, #e5e7eb 0 75%, transparent 0); background-size: 24px 24px}
        .dark-checker{background-image: conic-gradient(#1f1f23 25%, transparent 0 50%, #1f1f23 0 75%, transparent 0); background-size: 24px 24px}
        ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:10px}
        @keyframes birdArc {
          0% { transform: translate(-22vw, 62vh) rotate(-8deg); }
          15% { transform: translate(5vw, 40vh) rotate(4deg); }
          35% { transform: translate(30vw, 16vh) rotate(2deg); }
          50% { transform: translate(50vw, 10vh) rotate(0deg); }
          70% { transform: translate(75vw, 20vh) rotate(-4deg); }
          100% { transform: translate(122vw, 55vh) rotate(12deg); }
        }
        @keyframes wingFlap {
          0%, 100% { transform: rotate(-18deg); }
          50% { transform: rotate(28deg); }
        }
        @keyframes wingFlap2 {
          0%, 100% { transform: rotate(18deg); }
          50% { transform: rotate(-22deg); }
        }
        @keyframes dotDrop {
          0% { transform: translateY(0) scale(1); opacity: 1; }
          30% { transform: translateY(55px) scale(1.1); }

          80% { transform: translateY(165px) scale(0.9); }
          100% { transform: translateY(175px) scale(1.05); opacity: 1; }
        }
        @keyframes giftPopMinimal {
          0% { transform: scale(0.92) translateY(12px); opacity: 0; }
          100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes confettiFall {
          0% { transform: translateY(-10px) scale(0.6); opacity: 0; }
          20% { opacity: 1; }
          100% { transform: translateY(22px) scale(1); opacity: 0.85; }
        }
        .bird-track { animation: birdArc 3.2s cubic-bezier(0.42,0,0.58,1) forwards; will-change: transform; }
        .wing-flap { animation: wingFlap 0.14s ease-in-out infinite; transform-origin: 80% 50%; }
        .wing-flap-2 { animation: wingFlap2 0.14s ease-in-out infinite; transform-origin: 20% 50%; }
        .animate-dotFall { animation: dotDrop 0.9s cubic-bezier(0.3,0,0.7,1) forwards; }
        .animate-giftPop { animation: giftPopMinimal 0.45s cubic-bezier(0.22,1,0.36,1) forwards; }

<style id="donum-ecosystem-shell">
  :root{--da-gold:#D9A441;--da-gold2:#F2C15A;--da-ink:#071827;--da-blue:#0B3555;--da-sky:#DDEEFF}
  html,body{min-height:100%;margin:0}
  #root{display:none}
  #donum-home{position:fixed;inset:0;z-index:99999;overflow:auto;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
    radial-gradient(circle at 50% 8%,rgba(242,193,90,.18),transparent 30%),
    linear-gradient(145deg,#061522 0%,#0a2943 48%,#0d4260 100%)}
  #donum-home:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:
    radial-gradient(circle at 12% 85%,rgba(242,193,90,.12),transparent 24%),
    radial-gradient(circle at 88% 25%,rgba(125,211,252,.12),transparent 22%)}
  .da-wrap{position:relative;z-index:1;min-height:100%;box-sizing:border-box;max-width:920px;margin:auto;padding:30px 18px 28px;display:flex;flex-direction:column;align-items:center}
  .da-top{width:100%;display:flex;justify-content:flex-end;gap:8px}
  .da-pill{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;border-radius:999px;height:36px;padding:0 13px;cursor:pointer;backdrop-filter:blur(12px);font-size:13px;font-weight:600}
  .da-brand{text-align:center;margin-top:12px}
  .da-mascot{width:118px;height:82px;margin:0 auto 2px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.32));overflow:visible}
  .da-name{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.045em;font-size:clamp(42px,8vw,72px);line-height:.95;color:var(--da-gold2);text-shadow:0 2px 0 rgba(0,0,0,.18),0 0 24px rgba(242,193,90,.13)}
  .da-name span{color:#fff0bf}
  .da-tag{margin-top:8px;color:#f4d98d;letter-spacing:.28em;text-transform:uppercase;font-size:10px;font-weight:800}
  .da-rule{width:88px;height:2px;margin:13px auto 0;border-radius:99px;background:linear-gradient(90deg,transparent,var(--da-gold2),transparent)}
  .da-question{font-family:Georgia,"Times New Roman",serif;font-style:italic;text-align:center;font-size:clamp(25px,4.8vw,38px);margin:28px 0 22px;color:#fff}
  .da-question:after{content:"";display:block;width:72px;height:3px;border-radius:99px;background:var(--da-gold2);margin:10px auto 0}
  .da-grid{width:min(100%,690px);display:grid;grid-template-columns:1fr;gap:9px}
  .da-card{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 13px;border-radius:17px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.045));box-shadow:0 9px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(14px);color:#fff;cursor:pointer;text-align:left;transition:transform .18s ease,border-color .18s ease,background .18s ease}
  .da-card:hover{transform:translateY(-2px);border-color:rgba(242,193,90,.55);background:linear-gradient(135deg,rgba(242,193,90,.17),rgba(255,255,255,.055))}
  .da-card:active{transform:translateY(0) scale(.99)}
  .da-icon{width:39px;height:39px;flex:0 0 39px;border-radius:12px;display:grid;place-items:center;color:#1b2a35;background:linear-gradient(145deg,#f7d475,#c9962f);box-shadow:0 5px 14px rgba(0,0,0,.2)}
  .da-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .da-card strong{display:block;font-size:14px;line-height:1.1}.da-card small{display:block;margin-top:4px;font-size:10px;color:rgba(255,255,255,.62);line-height:1.1}
  .da-arrow{margin-left:auto;color:#f2c15a;font-size:20px;line-height:1}
  .da-note{margin-top:22px;color:rgba(255,255,255,.55);font-size:11px;text-align:center;max-width:520px}
  #da-coming{position:fixed;inset:0;z-index:100000;display:none;place-items:center;background:rgba(2,10,17,.58);backdrop-filter:blur(7px);padding:20px}
  .da-modal{width:min(420px,100%);border:1px solid rgba(242,193,90,.32);border-radius:22px;background:linear-gradient(145deg,#0c2b44,#071a2b);padding:28px 24px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.4)}
  .da-modal .da-mini{font-size:35px}.da-modal h3{margin:9px 0 6px;color:#f2c15a;font:700 26px Georgia,serif}.da-modal p{margin:0;color:rgba(255,255,255,.72);font-size:13px;line-height:1.5}.da-close{margin-top:18px;border:0;border-radius:999px;padding:10px 18px;background:#f2c15a;color:#17212a;font-weight:800;cursor:pointer}
  #da-image-back{display:none;position:fixed;z-index:10001;left:14px;top:66px;height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(217,164,65,.42);background:rgba(7,24,39,.92);color:#f6d886;font:700 12px Inter,sans-serif;box-shadow:0 8px 25px rgba(0,0,0,.18);cursor:pointer;backdrop-filter:blur(12px)}
  #da-sync-brand{display:none;position:fixed;z-index:10002;left:14px;top:9px;align-items:center;gap:7px;color:#d9a441;font:800 17px Georgia,serif;letter-spacing:.01em;pointer-events:none}
  #da-sync-brand svg{width:34px;height:28px;filter:drop-shadow(0 2px 7px rgba(217,164,65,.18))}
  body.da-images header > div > div:first-child{visibility:hidden}
  body.da-images #da-image-back,body.da-images #da-sync-brand{display:flex}
  body.da-images #donum-home{display:none}
  @media(max-width:560px){.da-wrap{padding:20px 14px 22px}.da-brand{margin-top:4px}.da-mascot{width:100px;height:70px}.da-grid{gap:8px;max-width:500px}.da-card{min-height:58px;padding:8px 11px;border-radius:15px}.da-icon{width:36px;height:36px;flex-basis:36px}.da-note{margin-top:16px}.da-question{margin-top:24px;margin-bottom:18px}}
</style>

<script id="donum-ecosystem-shell-js">
(function(){
  var home=document.getElementById('donum-home'), root=document.getElementById('root'), modal=document.getElementById('da-coming');
  var lang='es';
  function setLang(next){lang=next; document.documentElement.lang=lang; document.querySelectorAll('[data-es][data-en]').forEach(function(el){el.textContent=el.getAttribute('data-'+lang)}); document.getElementById('da-lang').textContent=lang==='es'?'ES · EN':'EN · ES';}
  function openImages(){document.body.classList.add('da-images');home.style.display='none';root.style.display='block';window.scrollTo(0,0);}
  function openHome(){document.body.classList.remove('da-images');root.style.display='none';home.style.display='block';modal.style.display='none';window.scrollTo(0,0);}
  document.getElementById('da-lang').addEventListener('click',function(){setLang(lang==='es'?'en':'es');});
  document.querySelectorAll('.da-card').forEach(function(card){card.addEventListener('click',function(){if(card.getAttribute('data-tool')==='images'){openImages();}else{modal.style.display='grid';}});});
  document.querySelector('.da-close').addEventListener('click',function(){modal.style.display='none';});
  modal.addEventListener('click',function(e){if(e.target===modal)modal.style.display='none';});
  document.getElementById('da-image-back').addEventListener('click',openHome);
  setLang('es');
})();
</script>
